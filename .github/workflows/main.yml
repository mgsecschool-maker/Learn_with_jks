name: Build Learn With JKS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check ZIP file
        run: |
          test -f LearnWithJKS_Android_Project.zip
          echo "ZIP file found"

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -o LearnWithJKS_Android_Project.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle
          echo "Android project extracted successfully"

      - name: Setup Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Learn-With-JKS-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
